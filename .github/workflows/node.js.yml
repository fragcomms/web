# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci

    - name: Biome Lint and Format
      id: lint
      continue-on-error: true
      run: npx @biomejs/biome check --reporter=github .

    - name: Report lint warning
      if: steps.lint.outcome == 'failure'
      run: echo "::warning title=Biome found formatting or linting issues. Review the inline PR annotations or the job output."

    - run: npm run build --if-present
    
    - run: npm run test:ci
