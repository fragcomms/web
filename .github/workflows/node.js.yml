# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "workflow-test" ]
  pull_request:
    branches: [ "main", "workflow-test" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Lint (non-blocking)
      id: lint
      continue-on-error: true
      run: npm run lint
    - name: Report lint warning
      if: steps.lint.outcome == 'failure'
      run: echo "::warning title=Lint issues detected::npm run lint failed. Review lint output in this job."
    - run: npm run build --if-present
    - name: Dev environment smoke check
      run: |
        set +e
        timeout 45s npm run dev
        code=$?
        set -e
        if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
          exit "$code"
        fi
    - run: npm run test --if-present
